<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Preset Automation — 2026-06-30</title><style>
:root{--ink:#15181d;--mut:#6b7280;--line:#e6e8eb;--accent:#7b2ff7}
*{box-sizing:border-box}body{font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f7f8fa;margin:0;padding:32px 18px}
.wrap{max-width:880px;margin:0 auto}h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}.sub{color:var(--mut);margin:0 0 24px}

.tag{font-size:12px;font-weight:600;color:var(--accent);background:#f4eefe;border:1px solid #d9c6fb;border-radius:6px;padding:2px 8px}
.score{font-size:12px;font-weight:700;color:#fff;background:var(--accent);border-radius:6px;padding:2px 8px;margin-left:auto}

.noimg{width:220px;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;border:1px dashed var(--line);border-radius:10px}

</style></head><body><div class="wrap">
<h1>Daily Preset Automation — 2026-06-30</h1><p class="sub">2 presets across categories · previews + copy-ready prompts. Use in Picsart Create / GenAI / Flow.</p>
<section class="card">
  <h2>Vertigo Rush <span class="tag">cinematic</span><span class="score">9/10</span></h2>
  <div class="media"><video src="https://cdn-editing-temp.picsart.com/editing-temp/b7eeb2ee-465b-4c30-a0e8-66ce909c7bd5.mp4" controls preload="metadata" playsinline></video><img src="https://cdn-pipeline-output.picsart.com/pipeline-output/ae8d9e98-0704-475e-8dab-a175a5f39b4f.png" loading="lazy" alt="hero photo"></div>
  <label>Prompt — click to select, then copy</label>
  <textarea readonly onclick="this.select()">Animate from the user&#x27;s uploaded photo. The person in the photo remains perfectly still and locked in the center of the frame; their face, expression, hair, skin tone, and clothing are preserved perfectly throughout the video. Over 3 seconds, a smooth and dramatic dolly-zoom (Vertigo effect) is executed: the camera dollies backward while the lens zooms in, keeping the subject the exact same size and in sharp focus. This action causes the background to dramatically warp and compress, appearing to rush toward the viewer and creating a mind-bending sense of perspective shift. The effect is clean, cinematic, and focused entirely on the background transformation while the subject remains the static hero of the shot. Full-frame 9:16.</textarea>
</section><section class="card">
  <h2>ChromeFlow <span class="tag">transformation</span></h2>
  <div class="media"><video src="https://cdn-editing-temp.picsart.com/editing-temp/6fd613a7-6e21-4557-8944-611e95242c58.mp4" controls preload="metadata" playsinline></video><img src="https://cdn-pipeline-output.picsart.com/pipeline-output/28293afa-9a8f-4c8d-9199-e8ce7df9fa98.png" loading="lazy" alt="hero photo"></div>
  <label>Prompt — click to select, then copy</label>
  <textarea readonly onclick="this.select()">Animate the user&#x27;s uploaded 9:16 photo. The subject&#x27;s face, expression, hair, and clothing must remain perfectly static and unchanged, preserving their identity throughout. Starting from the base of the neck, shimmering liquid chrome begins to flow smoothly upwards across the subject&#x27;s skin. The molten metal is highly reflective and fluid, like mercury, creeping over the shoulders, cheeks, and forehead over a 3-second duration. The transformation stops just below the eyes and hairline, leaving the core facial features (eyes, nose, mouth) and hair completely untouched and natural. The camera remains completely locked and stable with zero movement, zoom, or push-in. The final frame is a seamless blend of the original person and the new cybernetic chrome elements.</textarea>
</section>
