<title>Daily Preset Automation — 2026-06-24</title><style>
:root{--ink:#15181d;--mut:#6b7280;--line:#e6e8eb;--accent:#7b2ff7}

textarea{width:100%;min-height:120px;border:1px solid var(--line);border-radius:10px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:#fafbfc;resize:vertical}
