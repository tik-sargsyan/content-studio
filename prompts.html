<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Preset Automation — 2026-06-26</title><style>
:root{--ink:#15181d;--mut:#6b7280;--line:#e6e8eb;--accent:#7b2ff7}
*{box-sizing:border-box}body{font:15px/1.55 -apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);background:#f7f8fa;margin:0;padding:32px 18px}
